name: PushToHarbor

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Egress-Schutz: blockt/loggt ausgehende Verbindungen, die nicht zur Allowlist
    # gehoeren. Muss der ERSTE Step in jedem Job bleiben. Siehe Vorfall 04.09.2026.
    - uses: LG-Systementwicklung/.github/actions/harden-runner@main

    - uses: actions/checkout@v5

    - uses: docker/login-action@v3
      with:
        registry: harbor.lgs-dev.de
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          harbor.lgs-dev.de/PROJEKT/${{ github.event.repository.name }}:${{ github.run_number }}
          harbor.lgs-dev.de/PROJEKT/${{ github.event.repository.name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
