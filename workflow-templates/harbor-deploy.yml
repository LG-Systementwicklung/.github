name: PushToHarbor

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
    - uses: actions/checkout@v5

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: harbor.lgs-system.de
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          harbor.lgs-system.de/PROJEKT/${{ github.event.repository.name }}:${{ github.run_number }}
          harbor.lgs-system.de/PROJEKT/${{ github.event.repository.name }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: TriggerPortainerUpdate
      id: portainer
      if: ${{ env.PORTAINER_WEBHOOK_URL != '' }}
      run: curl -s -X POST "$PORTAINER_WEBHOOK_URL"

    - name: NotifyDiscord
      if: always()
      run: |
        if [ "${{ steps.portainer.outcome }}" = "success" ]; then
          portainer_line=" Portainer wurde informiert."
        elif [ "${{ steps.portainer.outcome }}" = "skipped" ]; then
          portainer_line=" Portainer: kein Webhook konfiguriert (PORTAINER_WEBHOOK_URL fehlt)."
        else
          portainer_line=" Portainer-Benachrichtigung fehlgeschlagen."
        fi
        if [ "${{ job.status }}" = "success" ]; then
          payload="{\"content\": \"✅ **${{ github.event.repository.name }}** wurde erfolgreich gebaut und gepusht (Tag \`${{ github.run_number }}\` und \`latest\`).${portainer_line}\"}"
        else
          payload="{\"content\": \"❌ Build von **${{ github.event.repository.name }}** ist fehlgeschlagen.${portainer_line}\"}"
        fi
        curl -s -H "Content-Type: application/json" -d "$payload" "${{ secrets.DISCORD_WEBHOOK_URL }}"
